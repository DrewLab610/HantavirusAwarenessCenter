<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Received</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.thankyou-box{
    background:#ffffff;
    max-width:600px;
    width:100%;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.check-icon{
    width:90px;
    height:90px;
    background:#22c55e;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-size:40px;
    font-weight:bold;
}

h1{
    color:#0f172a;
    margin-bottom:15px;
    font-size:32px;
}

p{
    color:#475569;
    line-height:1.7;
    margin-bottom:25px;
}

.back-btn{
    display:inline-block;
    padding:14px 28px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.back-btn:hover{
    background:#1d4ed8;
}

</style>

</head>
<body>

<div class="thankyou-box">

    <div class="check-icon">
        ✓
    </div>

    <h1>Submission Received</h1>

    <p>
        Thank you for submitting your information.
        Your response has been successfully received and recorded.
        Public health support teams may contact you if additional
        information is required.
    </p>

    <a href="index.html" class="back-btn">
        Return Home
    </a>

</div>

</body>
</html>
